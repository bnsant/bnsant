name: Update profile art

on:
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'
  push:
    branches: [main]
    paths:
      - assets/20260921_145053.png
      - scripts/config.json
      - scripts/generate.py
      - scripts/update_stats.py
      - .github/workflows/update-readme.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh GitHub stats
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_stats.py
      - run: python scripts/generate.py
      - name: Commit regenerated profile
        run: |
          if ! git diff --quiet -- scripts/config.json assets/dark_mode.svg assets/light_mode.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/config.json assets/dark_mode.svg assets/light_mode.svg
            git commit -m "Update profile stats and SVGs"
            git push
          fi
